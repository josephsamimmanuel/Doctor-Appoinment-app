<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCare+ Admin Login</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg, #0b0b1a, #141428, #7c3aed)}
    .login-card{width:min(92vw,420px);background:var(--color-surface);padding:28px;border-radius:16px;box-shadow:var(--shadow-2xl)}
    .brand{font-family:var(--font-heading);font-size:1.4rem;margin-bottom:8px}
    .sub{color:var(--color-gray-500);margin-bottom:20px}
  </style>
</head>
<body>
  <form class="login-card" id="loginForm">
    <h1 class="brand">MediCare+ Admin Panel</h1>
    <p class="sub">Sign in to manage appointments and operations.</p>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" required placeholder="admin@medicareplus.in" /></div>
    <div class="form-group"><label class="form-label">Password</label><input class="form-input" name="password" type="password" required placeholder="••••••••" /></div>
    <button class="btn btn-primary btn-block" type="submit">Login</button>
    <div class="mt-3 text-right"><a href="#">Forgot Password?</a></div>
  </form>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();Toast.success('Login successful. Redirecting...');setTimeout(()=>location.href='dashboard.html',700);});
  </script>
</body>
</html>
