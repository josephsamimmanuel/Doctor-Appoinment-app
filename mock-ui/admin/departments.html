<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Departments</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/></head><body>
<div class="page-content"><div class="flex justify-between items-center"><h1 class="page-header-title">Department Management</h1><button class="btn btn-primary" data-modal-open="deptModal">Add Department</button></div>
<div class="grid md:grid-cols-3 gap-3 mt-3"><div class="card"><div class="card-body"><h3>Cardiology</h3><p>Heart care unit</p><p>Doctors: 8</p><p>Head: Dr. Ramesh Iyer</p><button class="btn btn-ghost btn-sm" data-modal-open="deptModal">Edit</button><button class="btn btn-danger btn-sm" data-modal-open="removeModal">Remove</button></div></div></div>
<div class="card mt-3"><div class="card-header"><h3>Doctor Allocation View</h3></div><div class="card-body"><ul><li>Cardiology: Dr. Ramesh, Dr. Anil</li><li>Neurology: Dr. Priya, Dr. Nisha</li></ul></div></div></div>
<div class="modal-overlay" id="deptModal"><div class="modal"><div class="modal-header"><h3 class="modal-title">Add/Edit Department</h3><button class="modal-close" data-modal-close="deptModal">✕</button></div><form class="modal-body"><input class="form-input mb-2" placeholder="Department name"/><textarea class="form-textarea mb-2" placeholder="Description"></textarea><input class="form-input mb-2" placeholder="Head of Department"/><button class="btn btn-primary">Save</button></form></div></div>
<div class="modal-overlay" id="removeModal"><div class="modal"><div class="modal-header"><h3 class="modal-title">Confirm Remove</h3><button class="modal-close" data-modal-close="removeModal">✕</button></div><div class="modal-body"><p>Remove department?</p><button class="btn btn-danger">Yes, Remove</button></div></div></div>
<script src="../js/app.js"></script><script>Modal.init();document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();Toast.success('Department saved')});</script></body></html>
