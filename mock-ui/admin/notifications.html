<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Admin Notifications</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/></head><body>
<div class="page-content"><div class="flex justify-between items-center"><h1 class="page-header-title">Admin Notifications</h1><button class="btn btn-outline" id="markAll">Mark all as read</button></div>
<div class="card mt-3"><div class="card-header"><h3>Notification Feed</h3></div><div class="card-body"><div class="notification-item unread"><div class="notification-item-content"><div class="notification-item-title">New appointment booked</div><div class="notification-item-desc">Arjun Sharma booked Cardiology consultation</div></div><span class="badge badge-info">Unread</span></div><div class="notification-item"><div class="notification-item-content"><div class="notification-item-title">Payment issue detected</div><div class="notification-item-desc">Transaction TXN-992 failed</div></div><span class="badge badge-gray">Read</span></div><div class="notification-item unread"><div class="notification-item-content"><div class="notification-item-title">Cancellation request</div><div class="notification-item-desc">Patient requested cancellation</div></div><span class="badge badge-info">Unread</span></div></div></div>
<div class="card mt-3"><div class="card-header"><h3>Notification Settings</h3></div><div class="card-body"><label class="form-switch"><input type="checkbox" class="form-switch-input" checked/><span>Appointment updates</span></label><label class="form-switch"><input type="checkbox" class="form-switch-input" checked/><span>Payment issues</span></label><label class="form-switch"><input type="checkbox" class="form-switch-input"/><span>System alerts</span></label></div></div>
</div><script src="../js/app.js"></script><script>markAll.onclick=()=>{document.querySelectorAll('.unread').forEach(x=>x.classList.remove('unread'));Toast.success('All notifications marked as read')};</script></body></html>
