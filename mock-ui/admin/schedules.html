<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Schedules</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/></head><body>
<div class="page-content"><h1 class="page-header-title">Schedule Management</h1>
<div class="card"><div class="card-header"><h3>Doctor Schedule Overview (Weekly)</h3></div><div class="card-body">Grid placeholder showing all doctors and weekly slots.</div></div>
<div class="card mt-3"><div class="card-header"><h3>Individual Doctor Schedule Editor</h3></div><div class="card-body"><select class="form-select mb-2"><option>Dr. Ramesh</option></select><textarea class="form-textarea" placeholder="Day-wise time slots and breaks"></textarea></div></div>
<div class="grid md:grid-cols-2 gap-3 mt-3"><div class="card"><div class="card-header"><h3>Leave Calendar</h3></div><div class="card-body"><input type="date" class="form-input"/><button class="btn btn-outline mt-2">Mark Unavailable</button></div></div><div class="card"><div class="card-header"><h3>Waitlist Management</h3></div><div class="card-body">Patients waiting per doctor + auto-assign option.</div></div></div>
<div class="card mt-3"><div class="card-header"><h3>Queue Management</h3></div><div class="card-body"><p>Current serving token: <strong>A-024</strong></p><button class="btn btn-primary">Next Token</button></div></div>
</div><script src="../js/app.js"></script><script>document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>Toast.success('Schedule action saved'));</script></body></html>
