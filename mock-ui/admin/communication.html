<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Communication Hub</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/></head><body>
<div class="page-content"><h1 class="page-header-title">Communication Hub</h1>
<div class="card"><div class="card-header"><h3>Broadcast Announcements</h3></div><form class="card-body"><input class="form-input mb-2" placeholder="Title"/><textarea class="form-textarea mb-2" placeholder="Message"></textarea><select class="form-select mb-2"><option>Target Audience</option></select><button class="btn btn-primary">Create Announcement</button></form></div>
<div class="card mt-3"><div class="card-header"><h3>Reminder Configuration</h3></div><div class="card-body"><label class="form-switch"><input class="form-switch-input" type="checkbox" checked/><span>24h before</span></label><label class="form-switch"><input class="form-switch-input" type="checkbox" checked/><span>1h before</span></label><label class="form-switch"><input class="form-switch-input" type="checkbox"/><span>Custom</span></label><p class="mt-2">Channels: Email / SMS / Push</p></div></div>
<div class="card mt-3"><div class="card-header"><h3>Email/SMS Templates</h3></div><div class="card-body"><p>Use placeholders: {patient_name}, {doctor_name}, {date}, {time}</p><button class="btn btn-outline">Create Template</button></div></div>
<div class="card mt-3"><div class="card-header"><h3>Sent Messages Log</h3></div><div class="table-wrapper"><table class="table"><thead><tr><th>Time</th><th>Channel</th><th>Recipient</th><th>Status</th></tr></thead><tbody><tr><td>18 Aug 10:20</td><td>SMS</td><td>Arjun Sharma</td><td><span class="badge badge-success">Delivered</span></td></tr></tbody></table></div></div>
</div><script src="../js/app.js"></script><script>document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();Toast.success('Announcement sent')});</script></body></html>
