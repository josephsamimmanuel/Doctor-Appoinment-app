<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Patients</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/></head><body>
<div class="page-content"><div class="flex justify-between items-center"><h1 class="page-header-title">Patient Management</h1><div class="flex gap-2"><button class="btn btn-outline">Bulk Communication</button><button class="btn btn-primary" data-modal-open="patientModal">Register Walk-in Patient</button></div></div>
<input class="form-input mt-3" placeholder="Search by name / phone / email" data-search-target="patientsTable"/>
<div class="table-wrapper mt-3"><table class="table" id="patientsTable"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Visit Count</th><th>Last Visit</th><th>Actions</th></tr></thead><tbody><tr><td>Arjun Sharma</td><td>+91 98412 56789</td><td>arjun@gmail.com</td><td>8</td><td>12 Aug 2026</td><td><a class="btn btn-ghost btn-sm" href="patient-detail.html">View History</a><button class="btn btn-ghost btn-sm">Message</button></td></tr></tbody></table></div>
<div class="pagination mt-3"><button class="pagination-btn active">1</button><button class="pagination-btn">2</button></div></div>
<div class="modal-overlay" id="patientModal"><div class="modal"><div class="modal-header"><h3 class="modal-title">Register Walk-in Patient</h3><button class="modal-close" data-modal-close="patientModal">✕</button></div><form class="modal-body"><input class="form-input mb-2" placeholder="Name"/><input class="form-input mb-2" placeholder="Phone"/><input class="form-input mb-2" placeholder="Email"/><div class="grid md:grid-cols-3 gap-2"><input class="form-input" placeholder="Age"/><select class="form-select"><option>Gender</option></select><select class="form-select"><option>Blood Group</option></select></div><button class="btn btn-primary mt-3">Register</button></form></div></div>
<script src="../js/app.js"></script><script>Modal.init();document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();Toast.success('Patient registered')});document.querySelectorAll('.pagination-btn').forEach(b=>b.onclick=()=>Toast.info('Pagination simulated'));</script>
</body></html>
