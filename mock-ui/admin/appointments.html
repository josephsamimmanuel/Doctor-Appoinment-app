<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Appointments</title>
<link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/>
<style>.wrap{padding:16px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.view{display:none}.view.active{display:block}.layout-main{margin-left:260px}@media(max-width:1023px){.layout-main{margin-left:0}}</style></head><body>
<div class="admin-layout"><aside class="sidebar"><div class="sidebar-header"><div class="text-white">MediCare+ Admin Panel</div></div><nav class="sidebar-nav"><a class="sidebar-nav-link active" href="appointments.html">📅 Appointments</a></nav></aside><div class="sidebar-overlay"></div>
<main class="layout-main"><div class="top p-4 border-bottom flex justify-between"><button class="btn btn-ghost" data-sidebar-toggle>☰</button><div class="flex gap-2"><button class="btn btn-primary" data-modal-open="walkinModal">Create Walk-in Appointment</button></div></div>
<div class="wrap page"><div class="tabs tabs-pills"><div class="tabs-header"><button class="tab-btn active" data-tab="calendar">Calendar View</button><button class="tab-btn" data-tab="list">List View</button></div></div>
<div class="filters mt-3"><select class="form-select"><option>All Doctors</option></select><select class="form-select"><option>All Departments</option></select><select class="form-select"><option>All</option><option>Pending</option><option>Confirmed</option><option>In-Progress</option><option>Completed</option><option>Cancelled</option><option>No-Show</option></select><input class="form-input" type="date"/><select class="form-select"><option>All</option><option>In-Person</option><option>Telemedicine</option></select></div>
<section class="view active mt-4" data-tab-panel="calendar"><div class="calendar"><div class="calendar-header"><button class="calendar-nav-btn" id="prevMonth">‹</button><div id="monthLabel">August 2026</div><button class="calendar-nav-btn" id="nextMonth">›</button></div><div class="calendar-grid"><div class="calendar-weekdays"><div class="calendar-weekday">Su</div><div class="calendar-weekday">Mo</div><div class="calendar-weekday">Tu</div><div class="calendar-weekday">We</div><div class="calendar-weekday">Th</div><div class="calendar-weekday">Fr</div><div class="calendar-weekday">Sa</div></div><div class="calendar-days" id="calendarDays"></div></div></div></section>
<section class="view mt-4" data-tab-panel="list"><div class="mb-3"><button class="btn btn-outline btn-sm">Bulk: Change Status</button></div><div class="table-wrapper"><table class="table"><thead><tr><th><input type="checkbox"/></th><th>Patient Name</th><th>Doctor</th><th>Department</th><th>Date & Time</th><th>Mode</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr><td><input type="checkbox"/></td><td>Arjun Sharma</td><td>Dr. Ramesh</td><td>Cardiology</td><td>18 Aug 10:30</td><td>In-Person</td><td><span class="badge badge-success">Confirmed</span></td><td><button class="btn btn-ghost btn-sm">View</button><button class="btn btn-ghost btn-sm">Edit</button><button class="btn btn-danger btn-sm">Cancel</button></td></tr></tbody></table></div><div class="pagination mt-3"><button class="pagination-btn active">1</button><button class="pagination-btn">2</button><button class="pagination-btn">3</button></div></section>
</div></main></div>
<div class="modal-overlay" id="walkinModal"><div class="modal"><div class="modal-header"><h3 class="modal-title">Create Walk-in Appointment</h3><button data-modal-close="walkinModal" class="modal-close">✕</button></div><form class="modal-body"><div class="form-group"><label class="form-label">Patient Search / Create</label><input class="form-input"/></div><div class="form-group"><label class="form-label">Doctor</label><select class="form-select"><option>Dr. Ramesh</option></select></div><div class="form-group"><label class="form-label">Time Slot</label><select class="form-select"><option>10:30 AM</option></select></div><div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea"></textarea></div><button class="btn btn-primary">Save</button></form></div></div>
<script src="../js/app.js"></script><script>
Tabs.initAll();Modal.init();const days=document.getElementById('calendarDays');days.innerHTML=Array.from({length:35},(_,i)=>`<div class="calendar-day ${[2,8,14,20,26].includes(i)?'has-appointment':''}">${i+1<=31?i+1:''}</div>`).join('');
let m=7,y=2026;const names=["January","February","March","April","May","June","July","August","September","October","November","December"];prevMonth.onclick=()=>{m=(m+11)%12;if(m===11)y--;monthLabel.textContent=`${names[m]} ${y}`};nextMonth.onclick=()=>{m=(m+1)%12;if(m===0)y++;monthLabel.textContent=`${names[m]} ${y}`};
document.querySelectorAll('.pagination-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pagination-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');Toast.info('Page changed')});
document.querySelector('[data-sidebar-toggle]').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');
</script></body></html>
