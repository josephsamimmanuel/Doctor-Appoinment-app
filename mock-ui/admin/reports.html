<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Reports</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/></head><body>
<div class="page-content"><h1 class="page-header-title">Reports</h1>
<div class="grid md:grid-cols-3 gap-2"><select class="form-select"><option>Operational</option><option>Revenue</option><option>Doctor Performance</option><option>Patient Demographics</option></select><input class="form-input" type="date"/><input class="form-input" type="date"/></div>
<div class="chart-container mt-3"><div class="chart-header"><h3>Visualization Area</h3></div><div class="chart-body"><div class="chart-placeholder">Placeholder charts with animation</div></div></div>
<div class="card mt-3"><div class="card-header"><h3>Data Table</h3></div><div class="table-wrapper"><table class="table"><thead><tr><th data-sort>Metric</th><th>Value</th></tr></thead><tbody><tr><td>Total Appointments</td><td>1248</td></tr></tbody></table></div></div>
<div class="flex gap-2 mt-3"><button class="btn btn-outline">Export CSV</button><button class="btn btn-outline">Export Excel</button><button class="btn btn-outline">Export PDF</button></div>
<div class="grid md:grid-cols-2 gap-3 mt-3"><div class="card"><div class="card-header"><h3>Doctor Performance Report</h3></div><div class="table-wrapper"><table class="table"><thead><tr><th>Doctor</th><th>Appointments</th><th>Avg Rating</th><th>No-show</th></tr></thead><tbody><tr><td>Dr. Ramesh</td><td>182</td><td>4.9</td><td>3%</td></tr></tbody></table></div></div><div class="card"><div class="card-header"><h3>Patient Demographics</h3></div><div class="card-body">Age distribution, gender ratio, top specialties, geographic distribution.</div></div></div>
</div><script src="../js/app.js"></script><script>document.querySelectorAll('th[data-sort]').forEach(h=>h.onclick=()=>Toast.info('Table sorting simulated'));document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>Toast.success('Export prepared'));</script></body></html>
