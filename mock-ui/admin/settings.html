<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Hospital Settings</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/></head><body>
<div class="page-content"><h1 class="page-header-title">Hospital Settings</h1>
<div class="tabs"><div class="tabs-header"><button class="tab-btn active" data-tab="profile">Hospital Profile</button><button class="tab-btn" data-tab="hours">Working Hours</button><button class="tab-btn" data-tab="holiday">Holiday Calendar</button><button class="tab-btn" data-tab="policy">Booking Policy</button><button class="tab-btn" data-tab="branches">Branches</button><button class="tab-btn" data-tab="terms">Terms & Conditions</button></div>
<div class="tab-panel active" data-tab-panel="profile"><div class="card mt-3"><form class="card-body"><input class="form-input mb-2" placeholder="Hospital Name"/><textarea class="form-textarea mb-2" placeholder="Description"></textarea><input class="form-input mb-2" placeholder="Contact details"/><input class="form-input mb-2" placeholder="Logo upload URL"/><button class="btn btn-primary">Save Profile</button></form></div></div>
<div class="tab-panel" data-tab-panel="hours"><div class="card mt-3"><div class="card-body">Mon-Sun day-wise open/close configuration table placeholder.</div></div></div>
<div class="tab-panel" data-tab-panel="holiday"><div class="card mt-3"><div class="card-body"><input type="date" class="form-input mb-2"/><input class="form-input mb-2" placeholder="Holiday description"/><button class="btn btn-outline">Add Holiday</button></div></div></div>
<div class="tab-panel" data-tab-panel="policy"><div class="card mt-3"><div class="card-body"><input class="form-input mb-2" placeholder="Cancellation window (hours)"/><textarea class="form-textarea" placeholder="Rescheduling rules and refund percentages"></textarea></div></div></div>
<div class="tab-panel" data-tab-panel="branches"><div class="card mt-3"><div class="card-body"><button class="btn btn-outline">Add Branch</button><p class="mt-2">Manage address, phone, working hours.</p></div></div></div>
<div class="tab-panel" data-tab-panel="terms"><div class="card mt-3"><div class="card-body"><textarea class="form-textarea" style="min-height:220px" placeholder="Rich text editor placeholder for T&C and privacy policy"></textarea></div></div></div></div>
</div><script src="../js/app.js"></script><script>Tabs.initAll();document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();Toast.success('Settings saved')});</script></body></html>
