<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Forgot Password | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{display:grid;place-items:center;min-height:100vh;background:var(--color-bg-primary)}.wrap{width:min(100%,430px)}.hidden{display:none}</style></head><body>
<div class="surface-card p-8 wrap"><h2 class="text-center">Forgot Password</h2><p class="text-secondary text-center mt-2 mb-5">Enter your email to receive a reset link.</p><form id="forgotForm"><div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" required></div><button class="btn btn-primary btn-block">Send Reset Link</button></form><div id="successBox" class="surface-card p-5 mt-5 hidden" style="background:var(--color-success-50);border-color:var(--color-success-100)"><strong>Check your email</strong><p class="text-secondary mt-2">We sent your password reset link successfully.</p></div><p class="text-center mt-5"><a href="login.html">Back to login</a></p></div>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>document.getElementById('forgotForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('successBox').classList.remove('hidden');Toast.success('Reset link sent')});</script>
</body></html>
