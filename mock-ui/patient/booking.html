<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Booking Flow | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-secondary)}.panel{display:none}.panel.active{display:block}</style></head><body class="page">
<section class="section"><div class="container stack"><div class="surface-card p-6"><div class="stepper" id="steps"></div></div>
<div class="surface-card p-6 panel active"><h2>1. Select Slot</h2><div id="cal"></div><div class="time-slots-grid mt-4" id="slotGrid"></div></div>
<div class="surface-card p-6 panel"><h2>2. Choose Mode</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4"><div class="surface-card p-5 selectable active"><h3>In-Person</h3><p>Consult at hospital</p><strong>₹1500</strong></div><div class="surface-card p-5 selectable"><h3>Video Consultation</h3><p>Consult online</p><strong>₹1200</strong></div></div></div>
<div class="surface-card p-6 panel"><h2>3. Patient Details</h2><label class="form-check"><input class="form-check-input" type="radio" name="for" checked><span>Self</span></label><label class="form-check"><input class="form-check-input" type="radio" name="for"><span>Family Member</span></label><textarea class="form-textarea mt-4" placeholder="Symptoms/notes"></textarea></div>
<div class="surface-card p-6 panel"><h2>4. Summary</h2><div class="summary-row"><span>Doctor</span><strong>Dr. Ramesh Iyer</strong></div><div class="summary-row"><span>Date/Time</span><strong>19 Aug, 10:30 AM</strong></div><div class="summary-row"><span>Mode</span><strong>Video</strong></div><div class="summary-row"><span>Fee</span><strong>₹1200</strong></div><div class="summary-row"><span>GST</span><strong>₹216</strong></div><div class="summary-row"><span>Total</span><strong>₹1416</strong></div></div>
<div class="surface-card p-6 panel"><h2>5. Payment</h2><div class="grid grid-cols-2 gap-3 mt-4" id="paymentMethods"></div><div class="surface-card p-5 mt-4"><h4>Mock Razorpay</h4><input class="form-input mt-3" placeholder="Payment detail"></div></div>
<div class="flex justify-between"><button id="prev" class="btn btn-ghost">Back</button><button id="next" class="btn btn-primary">Continue</button></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>const stepLabels=['Select Slot','Choose Mode','Patient Details','Summary','Payment'];const slotTimes=['09:00','09:30','10:00','10:30','11:00','11:30','14:00','14:30'];const paymentOptions=['UPI','Card','Net Banking','Wallet'];steps.innerHTML=stepLabels.map((label,index)=>`<div class="stepper-step ${index===0?'active':''}"><div class="stepper-circle">${index+1}</div><div class="stepper-label">${label}</div></div>`).join('');slotGrid.innerHTML=slotTimes.map((time,index)=>`<div class="time-slot ${index===1?'booked':''}">${time}</div>`).join('');paymentMethods.innerHTML=paymentOptions.map((method,index)=>`<div class="surface-card p-4 payment-method ${index===0?'active':''}">${method}</div>`).join('');let step=0;const p=[...document.querySelectorAll('.panel')],s=[...document.querySelectorAll('.stepper-step')];function r(){p.forEach((x,i)=>x.classList.toggle('active',i===step));s.forEach((x,i)=>{x.classList.toggle('active',i===step);x.classList.toggle('completed',i<step)});next.textContent=step===4?'Pay & Confirm':'Continue';prev.disabled=step===0;}prev.onclick=()=>{if(step>0)step--;r()};next.onclick=()=>{if(step<4){step++;Toast.info('Moved to next step')}else{Toast.success('Payment successful');location.href='booking-confirmation.html'}r()};document.querySelectorAll('.time-slot:not(.booked)').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('.time-slot').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});document.querySelectorAll('.selectable,.payment-method').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('.selectable,.payment-method').forEach(y=>y.classList.remove('active'));x.classList.add('active')});Calendar.render('cal',{selectedDate:'2026-08-19',minDate:'2026-08-18'});r();</script>
</body></html>
