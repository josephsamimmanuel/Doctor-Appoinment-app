<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Verify OTP | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{display:grid;place-items:center;min-height:100vh;background:var(--color-bg-secondary)}.wrap{width:min(100%,430px)}.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.otp input{text-align:center;font-size:1.2rem;font-weight:700}</style></head><body>
<div class="surface-card p-8 wrap"><h2 class="text-center">OTP Verification</h2><p class="text-secondary text-center mt-2 mb-5">Code sent to +91 98XXXX6789</p><div class="otp mb-5"><input class="form-input" maxlength="1" inputmode="numeric"/><input class="form-input" maxlength="1" inputmode="numeric"/><input class="form-input" maxlength="1" inputmode="numeric"/><input class="form-input" maxlength="1" inputmode="numeric"/><input class="form-input" maxlength="1" inputmode="numeric"/><input class="form-input" maxlength="1" inputmode="numeric"/></div><p id="timer" class="text-center text-secondary mb-4">Resend OTP in 30s</p><button id="verifyBtn" class="btn btn-primary btn-block">Verify</button></div>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>const i=[...document.querySelectorAll('.otp input')];i.forEach((x,n)=>{x.oninput=()=>{x.value=x.value.replace(/\D/g,'').slice(0,1);if(x.value&&i[n+1])i[n+1].focus()};x.onkeydown=e=>{if(e.key==='Backspace'&&!x.value&&i[n-1])i[n-1].focus()}});let t=30;const tm=document.getElementById('timer');const iv=setInterval(()=>{t--;tm.textContent=t>0?`Resend OTP in ${t}s`:'Resend OTP';if(t<=0)clearInterval(iv)},1000);document.getElementById('verifyBtn').onclick=()=>Toast.success('OTP verified')</script>
</body></html>
