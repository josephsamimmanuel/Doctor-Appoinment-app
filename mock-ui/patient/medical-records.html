<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Medical Records | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-primary)}</style></head><body>
<section class="section"><div class="container stack"><div class="flex justify-between items-center"><h1>Medical Records</h1><div class="flex gap-2"><select class="form-select"><option>Filter by type</option><option>Lab Report</option><option>Scan</option><option>Prescription</option><option>Other</option></select><button class="btn btn-outline" id="timelineT">Health Timeline</button></div></div><div class="file-upload-area"><div class="file-upload-icon">⬆️</div><div class="file-upload-text">Drop records here</div><div class="file-upload-hint">JPEG, PNG, PDF up to 10MB</div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${['Lab Report','Scan','Prescription','Other'].map((t,i)=>`<div class="surface-card p-5"><div class="flex justify-between"><div><span class="badge badge-primary">${t}</span><h3 class="mt-3">Record ${i+1}</h3><p class="text-secondary">18 Aug 2026 • Description snippet</p></div><div class="avatar avatar-lg">${t[0]}</div></div><div class="flex gap-2 mt-4"><button class="btn btn-outline btn-sm">Download</button><button class="btn btn-ghost btn-sm">Share</button></div></div>`).join('')}</div><div id="timeline" class="surface-card p-6 hidden"><h3>Chronological Timeline</h3><div class="timeline mt-4"><div class="timeline-item"><div class="timeline-dot success"></div><div class="timeline-content"><div class="timeline-title">Lab report uploaded</div><div class="timeline-time">Aug 18</div></div></div><div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-content"><div class="timeline-title">Prescription added</div><div class="timeline-time">Aug 17</div></div></div></div></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>timelineT.onclick=()=>timeline.classList.toggle('hidden');</script>
</body></html>
