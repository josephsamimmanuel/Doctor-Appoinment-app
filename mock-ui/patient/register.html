<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Register | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{display:grid;place-items:center;min-height:100vh;background:var(--color-bg-primary)}.card-wrap{width:min(100%,520px)}.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.strength span{height:8px;background:var(--color-gray-200);border-radius:999px}.strength .on{background:var(--color-success-500)}</style></head><body>
<div class="surface-card p-8 card-wrap"><h2 class="text-center mb-6">Create Account</h2><form id="regForm"><div class="form-group"><label class="form-label">Full Name</label><input class="form-input" required></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" required></div><div class="form-group"><label class="form-label">Phone Number</label><input class="form-input" type="tel" required></div></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div class="form-group"><label class="form-label">Password</label><input id="pwd" class="form-input" type="password" required></div><div class="form-group"><label class="form-label">Confirm Password</label><input class="form-input" type="password" required></div></div><div class="strength mb-2"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div><small class="text-secondary">Password strength: Strong</small><label class="form-check mt-4"><input class="form-check-input" type="checkbox" required><span class="form-check-label">I accept terms & conditions</span></label><button class="btn btn-primary btn-block mt-4">Register</button></form><div class="text-center mt-4 mb-3">OR</div><button class="btn btn-outline btn-block mb-3">Google Sign Up</button><button class="btn btn-ghost btn-block">Apple Sign Up</button><p class="text-center mt-5">Already have account? <a href="login.html">Login</a></p></div>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>document.getElementById('regForm').addEventListener('submit',e=>{e.preventDefault();Toast.success('Registration complete')});</script>
</body></html>
