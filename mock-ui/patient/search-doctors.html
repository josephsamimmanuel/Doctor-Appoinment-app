<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Search Doctors | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-primary)}.layout{display:grid;grid-template-columns:1fr;gap:20px}.results{display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:960px){.layout{grid-template-columns:280px 1fr}.results{grid-template-columns:repeat(2,1fr)}}</style></head><body class="page">
<nav class="navbar"><div class="navbar-inner"><a class="navbar-brand" href="index.html"><div class="navbar-brand-icon">+</div><span class="navbar-brand-text">MediCare<span>+</span></span></a><button class="hamburger"><span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span></button></div></nav>
<section class="section"><div class="container"><div class="search-bar"><div class="search-bar-input-wrapper"><span class="search-bar-icon">🔎</span><input id="q" class="search-bar-input" placeholder="Search by doctor name, specialty, hospital"></div><select id="sort" class="form-select"><option value="">Relevance</option><option value="rating_desc">Rating</option><option value="experience_desc">Experience</option><option value="fee_asc">Fee low-high</option><option value="fee_desc">Fee high-low</option></select></div>
<div class="layout mt-6"><aside class="surface-card p-5"><h3>Filters</h3><div class="filter-group mt-4"><strong>Specialty</strong><label class="form-check"><input class="form-check-input sp" type="checkbox" value="Cardiology"><span>Cardiology</span></label><label class="form-check"><input class="form-check-input sp" type="checkbox" value="Neurology"><span>Neurology</span></label><label class="form-check"><input class="form-check-input sp" type="checkbox" value="Pediatrics"><span>Pediatrics</span></label></div><div class="filter-group"><strong>Experience</strong><input class="w-full" type="range"></div><div class="filter-group"><strong>Rating</strong><input class="w-full" type="range" min="1" max="5"></div><div class="filter-group"><strong>Fee range</strong><input id="fee" class="w-full" type="range" min="500" max="2000" value="2000"></div><div class="filter-group"><strong>Language</strong><select class="form-select"><option>English</option><option>Tamil</option></select></div><label class="form-switch"><input class="form-switch-input" checked type="checkbox"><span>Available today</span></label></aside>
<div><div class="flex justify-between items-center mb-4"><p id="countText">Showing 1-10 of 45 doctors</p></div><div class="results" id="results"></div><div class="pagination mt-6"><button class="pagination-btn active">1</button><button class="pagination-btn">2</button><button class="pagination-btn">3</button><button class="pagination-btn">4</button><button class="pagination-btn">5</button></div></div></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>function draw(){let d=[...MockData.doctors];const q=(document.getElementById('q').value||'').toLowerCase();if(q)d=d.filter(x=>(x.name+x.specialty+MockData.hospital.name).toLowerCase().includes(q));const s=[...document.querySelectorAll('.sp:checked')].map(x=>x.value);if(s.length)d=d.filter(x=>s.includes(x.specialty));d=d.filter(x=>x.fee<=Number(document.getElementById('fee').value));const sort=document.getElementById('sort').value;if(sort)d=Search.filterDoctors(q,{sort,maxFee:Number(document.getElementById('fee').value)});document.getElementById('countText').textContent=`Showing 1-${Math.min(10,d.length)} of ${d.length} doctors`;document.getElementById('results').innerHTML=d.slice(0,10).map(x=>`<div class="doctor-card"><div class="doctor-card-banner"></div><div class="doctor-card-avatar"><div class="avatar avatar-xl"><span>${x.initials}</span></div></div><div class="doctor-card-body"><div class="doctor-card-name">${x.name}</div><div class="doctor-card-specialty">${x.specialty}</div><p class="text-sm text-secondary">${MockData.hospital.name}</p><div class="doctor-card-meta"><div class="doctor-card-meta-item">⭐ ${x.rating}</div><div class="doctor-card-meta-item">🕒 ${x.experience} yrs</div><div class="doctor-card-meta-item">₹${x.fee}</div></div><div class="doctor-card-fee"><span class="badge ${x.available?'badge-success':'badge-warning'}">${x.available?'Available':'Limited slots'}</span><a class="btn btn-primary btn-sm" href="booking.html">Book Now</a></div></div></div>`).join('')}document.querySelectorAll('.doctor-card').forEach(c=>c.onclick=()=>{});}document.addEventListener('DOMContentLoaded',()=>{draw();['q','sort','fee'].forEach(i=>document.getElementById(i).addEventListener('input',draw));document.querySelectorAll('.sp').forEach(i=>i.addEventListener('change',draw));});</script>
</body></html>
