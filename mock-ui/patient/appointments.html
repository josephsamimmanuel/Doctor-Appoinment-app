<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>My Appointments | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-primary)}</style></head><body>
<section class="section"><div class="container"><div class="tabs tabs-pills surface-card p-6"><div class="tabs-header"><button class="tab-btn active" data-tab="up">Upcoming</button><button class="tab-btn" data-tab="past">Past</button><button class="tab-btn" data-tab="can">Cancelled</button></div><div class="tab-panel active mt-5" data-tab-panel="up" id="upBox"></div><div class="tab-panel mt-5" data-tab-panel="past" id="pastBox"></div><div class="tab-panel mt-5" data-tab-panel="can"><div id="canBox"></div><div class="empty-state surface-card mt-4"><div class="empty-state-icon">📭</div><div class="empty-state-title">No cancelled appointments</div><p class="empty-state-desc">All your active or completed visits are available in other tabs.</p></div></div></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>function card(a){const d=MockData.getDoctorById(a.doctorId);return `<div class="appointment-card status-${a.status}"><div class="appointment-card-header"><div class="appointment-card-doctor"><div class="avatar avatar-md">${d.initials}</div><div><div class="appointment-card-doctor-name">${d.name}</div><div class="appointment-card-specialty">${d.specialty}</div></div></div><span class="badge ${Utils.getStatusBadgeClass(a.status)}">${a.status}</span></div><div class="appointment-card-details"><div class="appointment-card-detail-item"><span class="appointment-card-detail-label">Date</span><span class="appointment-card-detail-value">${a.date}</span></div><div class="appointment-card-detail-item"><span class="appointment-card-detail-label">Time</span><span class="appointment-card-detail-value">${a.time}</span></div><div class="appointment-card-detail-item"><span class="appointment-card-detail-label">Mode</span><span class="appointment-card-detail-value">${a.type}</span></div></div><div class="appointment-card-actions"><button class="btn btn-outline btn-sm">Reschedule</button><button class="btn btn-ghost btn-sm">Cancel</button>${a.type==='Video'?'<a class="btn btn-primary btn-sm" href="video-consultation.html">Join Video Call</a>':''}<a class="btn btn-primary btn-sm" href="appointment-detail.html">View Details</a></div></div>`}document.addEventListener('DOMContentLoaded',()=>{const a=MockData.appointments;upBox.innerHTML=a.filter(x=>['confirmed','pending'].includes(x.status)).slice(0,3).map(card).join('');pastBox.innerHTML=a.filter(x=>x.status==='completed').slice(0,3).map(card).join('');canBox.innerHTML=a.filter(x=>x.status==='cancelled').slice(0,2).map(card).join('');});</script>
</body></html>
