<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Payments | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-primary)}.expand{display:none}.open .expand{display:block}</style></head><body>
<section class="section"><div class="container stack"><div class="flex justify-between items-center"><h1>Payment History</h1><select class="form-select" style="max-width:220px"><option>All</option><option>Success</option><option>Failed</option><option>Refunded</option></select></div><div id="payList" class="stack"></div><div class="surface-card p-6"><h3>Refund Status Tracking</h3><div class="timeline mt-4"><div class="timeline-item"><div class="timeline-dot warning"></div><div class="timeline-content"><div class="timeline-title">Refund Initiated</div><div class="timeline-desc">Request accepted by gateway.</div></div></div><div class="timeline-item"><div class="timeline-dot gray"></div><div class="timeline-content"><div class="timeline-title">Bank Processing</div><div class="timeline-desc">Expected in 5-7 business days.</div></div></div></div></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>payList.innerHTML=MockData.payments.slice(0,6).map(p=>`<div class="surface-card p-5 card" data-id="${p.id}"><div class="flex justify-between items-center"><div><h3>${Utils.formatCurrency(p.amount)}</h3><p class="text-secondary">${p.date} • ${p.method} • ${MockData.getDoctorById(MockData.getAppointmentById(p.appointmentId).doctorId).name}</p></div><div class="flex gap-2"><span class="badge ${Utils.getStatusBadgeClass(p.status)}">${p.status}</span><button class="btn btn-ghost btn-sm more">Details</button></div></div><div class="expand mt-3"><div class="summary-row"><span>Transaction ID</span><strong>${p.transactionId}</strong></div><button class="btn btn-outline btn-sm mt-2">Download Invoice</button></div></div>`).join('');document.querySelectorAll('.more').forEach(b=>b.onclick=()=>b.closest('.card').classList.toggle('open'));</script>
</body></html>
