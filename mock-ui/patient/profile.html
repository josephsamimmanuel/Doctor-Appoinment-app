<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Profile | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-primary)}</style></head><body>
<section class="section"><div class="container stack"><div class="surface-card p-6 flex justify-between items-center"><div class="flex gap-4 items-center"><div class="avatar avatar-3xl">AS</div><div><h1>My Profile</h1><p class="text-secondary">Manage personal and health preferences</p></div></div><button class="btn btn-outline">Edit Photo</button></div>
<form id="profileForm" class="surface-card p-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="form-group"><label class="form-label">Name</label><input class="form-input" value="Arjun Sharma"></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" value="arjun.sharma@gmail.com"></div><div class="form-group"><label class="form-label">Phone</label><input class="form-input" value="+91 9841256789"></div><div class="form-group"><label class="form-label">Age</label><input class="form-input" value="34"></div><div class="form-group"><label class="form-label">Gender</label><select class="form-select"><option>Male</option><option>Female</option></select></div><div class="form-group"><label class="form-label">Blood Group</label><select class="form-select"><option>O+</option><option>A+</option></select></div></div><div class="form-group"><label class="form-label">Allergies</label><input class="form-input" value="Penicillin"></div><div class="form-group"><label class="form-label">Medical History</label><textarea class="form-textarea">Mild hypertension.</textarea></div><button class="btn btn-primary">Save Profile</button></form>
<div class="surface-card p-6"><div class="flex justify-between items-center"><h3>Family Members</h3><button class="btn btn-outline btn-sm" id="addM">Add Member</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4"><div class="surface-card p-4"><strong>Sneha • 6 • Female</strong><p class="text-secondary">Daughter</p><div class="mt-2"><button class="btn btn-ghost btn-sm">Edit</button><button class="btn btn-danger btn-sm">Delete</button></div></div></div></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="surface-card p-6"><h3>Notification Preferences</h3><label class="form-switch mt-3"><input class="form-switch-input" checked type="checkbox"><span>Email</span></label><label class="form-switch mt-3"><input class="form-switch-input" checked type="checkbox"><span>SMS</span></label><label class="form-switch mt-3"><input class="form-switch-input" type="checkbox"><span>Push</span></label></div><div class="surface-card p-6"><h3>Security & Settings</h3><button class="btn btn-outline mt-3" id="themeToggle">Dark/Light mode</button><select class="form-select mt-3"><option>English</option><option>Hindi</option></select><button class="btn btn-ghost mt-3">Change Password</button><button class="btn btn-danger mt-3">Delete account</button></div></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>profileForm.onsubmit=e=>{e.preventDefault();Toast.success('Profile saved')};addM.onclick=()=>Toast.info('Add family member modal opened');themeToggle.onclick=()=>ThemeManager.toggle();</script>
</body></html>
