<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Prescriptions | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-primary)}</style></head><body>
<section class="section"><div class="container"><h1 class="mb-5">Prescriptions</h1><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div id="rxList" class="stack"></div><div class="surface-card p-6"><h3>Prescription Details</h3><div class="table-wrapper mt-4"><table class="table"><thead><tr><th>Medicine</th><th>Dosage</th><th>Frequency</th><th>Duration</th></tr></thead><tbody id="medRows"></tbody></table></div><div class="mt-4"><strong>Doctor Notes</strong><p class="text-secondary mt-2">Maintain medication adherence and monitor vitals regularly.</p></div><button class="btn btn-primary mt-4">Download PDF</button></div></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>const list=MockData.prescriptions;rxList.innerHTML=list.map(r=>`<button class="surface-card p-5 text-left" onclick="showRx('${r.id}')"><strong>${MockData.getDoctorById(r.doctorId).name}</strong><p class="text-secondary">${r.date} • ${r.appointmentId}</p></button>`).join('');function showRx(id){const rx=list.find(x=>x.id===id)||list[0];medRows.innerHTML=rx.medicines.map(m=>`<tr><td>${m.name}</td><td>${m.dosage}</td><td>${m.frequency}</td><td>${m.duration}</td></tr>`).join('');Toast.info('Prescription loaded')}showRx(list[0].id);</script>
</body></html>
