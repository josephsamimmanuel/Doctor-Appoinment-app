<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Video Consultation | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{margin:0}.v{min-height:100vh;background:var(--color-bg-primary);color:#fff;display:grid;grid-template-columns:1fr}.stage{position:relative;padding:20px;display:flex;flex-direction:column;gap:16px}.main{flex:1;border-radius:24px;border:1px solid #ffffff20;background:radial-gradient(circle,#7c3aed,#0b0b1a 60%);display:grid;place-items:center}.thumb{position:absolute;right:30px;bottom:100px;width:120px;height:160px;border-radius:16px;background:var(--color-brand);display:grid;place-items:center}.controls{display:flex;gap:10px;justify-content:center}.c{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#ffffff1a;border:1px solid #ffffff28}.end{background:var(--color-secondary-500)}.chat{display:none;background:var(--color-bg-secondary);color:var(--color-text-primary);padding:16px}@media(min-width:980px){.v{grid-template-columns:1fr 340px}.chat{display:block}}</style></head><body>
<div class="v"><div class="stage"><div class="flex justify-between items-center"><div><strong>Dr. Ramesh Iyer</strong><p style="opacity:.7">00:06:14</p></div><button class="btn btn-outline" style="color:#fff;border-color:#fff" id="toggleChat">Chat</button></div><div class="main"><div class="text-center"><div class="spinner spinner-white mx-auto mb-4"></div><h2 style="color:#fff">Waiting for doctor...</h2></div><div class="thumb">You</div></div><div class="controls"><button class="c">🎤</button><button class="c">📷</button><button class="c">🖥️</button><button class="c">💬</button><a href="appointments.html" class="c end">✕</a></div></div><aside class="chat" id="chat"><h3>Chat</h3><div class="surface-card p-3 mb-2">Doctor will join shortly.</div><div class="surface-card p-3 mb-2" style="background:var(--color-bg-tertiary)">Please review my ECG report.</div><div class="flex gap-2 mt-3"><button class="btn btn-ghost btn-sm">📎</button><input class="form-input" placeholder="Type message"/><button class="btn btn-primary btn-sm">Send</button></div></aside></div>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>toggleChat.onclick=()=>chat.style.display=chat.style.display==='block'?'none':'block'</script>
</body></html>
