<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Help & Support | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-primary)}.acc .body{display:none}.acc.active .body{display:block}</style></head><body>
<section class="section"><div class="container stack"><div class="flex justify-between items-center"><h1>Help & Support</h1><a class="btn btn-danger" href="tel:108">Emergency SOS</a></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="stack">${['How to book?','How to reschedule?','How to pay online?','How to download prescription?'].map((q,i)=>`<div class="surface-card p-4 acc ${i===0?'active':''}"><button class="w-full text-left t">${q}</button><div class="body mt-2 text-secondary">Use the app flow to complete this action quickly from appointments/profile sections.</div></div>`).join('')}</div><form id="supportForm" class="surface-card p-6"><h3>Contact Form</h3><div class="form-group"><label class="form-label">Name</label><input class="form-input" required></div><div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" required></div><div class="form-group"><label class="form-label">Subject</label><input class="form-input" required></div><div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" required></textarea></div><p class="text-secondary">Support: care@medicareplus.in • +91 44 6789 0123</p><button class="btn btn-primary mt-4">Submit</button></form></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>document.querySelectorAll('.t').forEach(b=>b.onclick=()=>b.closest('.acc').classList.toggle('active'));supportForm.onsubmit=e=>{e.preventDefault();Toast.success('Support ticket submitted')};</script>
</body></html>
