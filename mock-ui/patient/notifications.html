<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Notifications | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{background:var(--color-bg-primary)}.item.unread{background:linear-gradient(90deg,var(--color-brand-light),transparent)}</style></head><body>
<section class="section"><div class="container stack"><div class="flex justify-between items-center"><div class="flex gap-3 items-center"><button class="notification-bell" style="background:var(--color-primary-500)">🔔<span class="notification-badge" id="badgeN">5</span></button><h1>Notification Center</h1></div><button class="btn btn-outline" id="markAll">Mark all as read</button></div><div id="list" class="stack"></div><div class="empty-state surface-card hidden" id="empty"><div class="empty-state-icon">🔕</div><div class="empty-state-title">No notifications</div><p class="empty-state-desc">You're all caught up.</p></div></div></section>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>const arr=[['✅','Appointment confirmed'],['⏰','Reminder'],['❌','Cancellation'],['📅','Slot available'],['💳','Payment receipt']];list.innerHTML=arr.map((n,i)=>`<div class="surface-card p-5 item ${i<3?'unread':''}"><div class="flex justify-between"><div class="flex gap-3"><div class="avatar avatar-md">${n[0]}</div><div><strong>${n[1]}</strong><p class="text-secondary">Mock notification message preview</p><small class="text-muted">${i+1}h ago</small></div></div><span class="badge ${i<3?'badge-primary':'badge-gray'}">${i<3?'Unread':'Read'}</span></div></div>`).join('');markAll.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('unread'));badgeN.textContent='0';Toast.success('All notifications marked as read')};</script>
</body></html>
