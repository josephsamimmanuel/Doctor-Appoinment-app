<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Login | MediCare+</title><link rel="stylesheet" href="../css/variables.css"/><link rel="stylesheet" href="../css/base.css"/><link rel="stylesheet" href="../css/components.css"/><style>body{display:grid;place-items:center;min-height:100vh;background:var(--color-bg-primary)}.card-wrap{width:min(100%,430px)}</style></head><body>
<div class="surface-card p-8 card-wrap"><div class="text-center mb-6"><div class="navbar-brand-text text-brand" style="font-size:2rem;color:var(--color-brand)">MediCare+</div></div>
<form id="loginForm"><div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" required></div><div class="form-group"><label class="form-label">Password</label><div class="input-group"><input id="loginPwd" class="form-input with-icon-right" type="password" required><button type="button" data-toggle-password="loginPwd" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--color-brand)">Show</button></div></div><div class="flex justify-between items-center mb-4"><label class="form-check"><input class="form-check-input" type="checkbox"><span class="form-check-label">Remember me</span></label><a href="forgot-password.html">Forgot Password</a></div><button class="btn btn-primary btn-block">Login</button></form>
<div class="text-center mt-5 mb-4">OR</div><button class="btn btn-outline btn-block mb-3">Sign in with Google</button><button class="btn btn-ghost btn-block">Sign in with Apple</button><p class="text-center mt-6">Don't have an account? <a href="register.html">Sign Up</a></p></div>
<script src="../js/mock-data.js"></script><script src="../js/app.js"></script><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();Toast.success('Logged in successfully')});document.querySelectorAll('[data-toggle-password]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.togglePassword);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'});</script>
</body></html>
